services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]

  api:
    environment:
      NODE_ENV: development
      ALLOW_LEGACY_GOOGLE_TOKENS: "true"
    ports: ["127.0.0.1:3001:3001"]

  web:
    ports: ["127.0.0.1:8443:8080"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER obrigatória}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "db:seed"]
    profiles: ["seed"]
